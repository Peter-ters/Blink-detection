<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detector de Piscada - OBT</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { 
      margin: 0; display: flex; justify-content: center; align-items: center; 
      background-color: #121212; height: 100vh; overflow: hidden; font-family: sans-serif; 
    }
    video { 
      width: 100%; max-width: 400px; border-radius: 12px; transform: scaleX(-1); /* Efeito espelho */
    }
    #status { 
      position: absolute; top: 20px; font-size: 20px; font-weight: bold; 
      background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 8px; color: white;
    }
  </style>
</head>
<body>
  
  <div id="status">Iniciando câmera...</div>
  <video id="webcam" autoplay playsinline muted style="width: 100%; transform: scaleX(-1);"></video>

  <script>
    const videoElement = document.getElementById('webcam');
    const statusText = document.getElementById('status');
    let piscando = false; // Trava para não registrar a mesma piscada várias vezes

    // Pontos exatos do MediaPipe para os olhos
    const OLHO_ESQUERDO = [33, 160, 158, 133, 153, 144];
    const OLHO_DIREITO = [362, 385, 387, 263, 373, 380];

    // Fórmula da distância entre dois pontos (Teorema de Pitágoras)
    function calcularDistancia(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // Aplicação da fórmula do EAR
    function calcularEAR(landmarks, indices) {
      const p1 = landmarks[indices[0]];
      const p2 = landmarks[indices[1]];
      const p3 = landmarks[indices[2]];
      const p4 = landmarks[indices[3]];
      const p5 = landmarks[indices[4]];
      const p6 = landmarks[indices[5]];

      const vertical1 = calcularDistancia(p2, p6);
      const vertical2 = calcularDistancia(p3, p5);
      const horizontal = calcularDistancia(p1, p4);

      return (vertical1 + vertical2) / (2.0 * horizontal);
    }

    // Configurando o MediaPipe FaceMesh
    const faceMesh = new FaceMesh({locateFile: (file) => {
      return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }});

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true, // Exige mais precisão nos olhos e lábios
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        const earEsquerdo = calcularEAR(landmarks, OLHO_ESQUERDO);
        const earDireito = calcularEAR(landmarks, OLHO_DIREITO);
        const earMedio = (earEsquerdo + earDireito) / 2.0;

        // VALOR CRÍTICO: Se a detecção estiver falhando, aumente para 0.22. Se estiver sensível demais, diminua para 0.18.
        const LIMIAR_PISCADA = 0.20; 

        if (earMedio < LIMIAR_PISCADA) {
          if (!piscando) {
            piscando = true; // Aciona a trava
            statusText.innerText = "PISCADA DETECTADA!";
            statusText.style.color = "#00FF00";
            
            // --- A MÁGICA ACONTECE AQUI ---
            // Envia a palavra "PISCADA" para o MIT App Inventor
            if (window.AppInventor) {
              window.AppInventor.setWebViewString("PISCADA");
            }
          }
        } else {
          piscando = false; // Destrava quando abre os olhos
          statusText.innerText = "Olhos Abertos";
          statusText.style.color = "#FFFFFF";
        }
      } else {
        statusText.innerText = "Rosto não detectado";
        statusText.style.color = "#FF4444";
      }
    });

    // Configurando e ligando a câmera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({image: videoElement});
      },
      width: 640,
      height: 480
    });
    camera.start();
  </script>
</body>
</html>
