<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando Inicialização...</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    body { margin: 0; padding: 0; background-color: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    #container { position: relative; width: 95vw; height: 95vw; max-width: 380px; max-height: 380px; border-radius: 50%; overflow: hidden; border: 4px solid #00ff66; box-shadow: 0 4px 20px rgba(0,255,102,0.3); }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: rotateY(180deg); }
    #scanner { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #00ff66; box-shadow: 0 0 15px #00ff66; z-index: 10; display: none; animation: scan 2s infinite linear; }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
  </style>
</head>
<body>

  <div id="container">
    <div id="scanner"></div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="saida"></canvas>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const scanner = document.getElementById('scanner');
    
    // Variáveis de Controle da Análise
    let isAnalysing = false;
    let startTime = 0;
    let eyeWasClosed = false;
    let closureTime = 0;

    // 3 Parâmetros de Personalização (Valores padrão iniciais)
    let cfgEarFechado = 0.22;
    let cfgEarAberto = 0.25;
    let cfgTempoMicrossono = 1000; // em milissegundos

    // Contadores Estatísticos
    let stats = { completas: 0, incompletas: 0, microssonos: 0 };

    const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
    faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.6 });
    faceMesh.onResults(onResults);

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        // ESCUTA comandos vindo do MIT App Inventor
        if (window.AppInventor) {
            let cmd = window.AppInventor.getWebViewString();
            
            // Se receber a ordem de START com as configurações anexadas
            if (cmd.startsWith("START") && !isAnalysing) {
                let partes = cmd.split(",");
                cfgEarFechado = parseFloat(partes[1]) || 0.22;
                cfgEarAberto = parseFloat(partes[2]) || 0.25;
                cfgTempoMicrossono = parseFloat(partes[3]) || 1000;
                
                startAnalysis();
            }
            // Se receber a ordem de INTERRUPÇÃO imediata
            if (cmd === "CANCEL") {
                resetAnalysis("INTERROMPIDO");
            }
        }
        await faceMesh.send({image: videoElement});
      },
      width: 480, height: 480
    });
    camera.start().then(() => { document.title = "Câmera Pronta"; });

    function startAnalysis() {
        isAnalysing = true;
        startTime = Date.now();
        stats = { completas: 0, incompletas: 0, microssonos: 0 };
        eyeWasClosed = false;
        scanner.style.display = "block";
        window.AppInventor.setWebViewString("RUNNING"); // Avisa o MIT que começou
    }

    function resetAnalysis(statusMotivo) {
        isAnalysing = false;
        scanner.style.display = "none";
        window.AppInventor.setWebViewString(statusMotivo);
        document.title = "0%";
    }

    function onResults(results) {
      if (!isAnalysing) return;

      let elapsed = (Date.now() - startTime) / 1000;
      let progresso = Math.round((elapsed / 30) * 100);
      
      // Envia o progresso para o MIT via WebViewString
      if (window.AppInventor) {
          window.AppInventor.setWebViewString("PROGRESSO," + progresso);
      }

      // Fim do tempo de análise (30 segundos)
      if (elapsed >= 30) {
          finishAnalysis();
          return;
      }

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // Calcula a média do EAR dos dois olhos
        const ear = (calcEAR(landmarks, 160, 144, 33, 133) + calcEAR(landmarks, 385, 380, 362, 263)) / 2;

        // Lógica de detecção baseada nos parâmetros customizados
        if (ear < cfgEarFechado && !eyeWasClosed) {
            eyeWasClosed = true;
            closureTime = Date.now();
        } 
        else if (ear > cfgEarAberto && eyeWasClosed) {
            let duracaoFechado = Date.now() - closureTime;

            if (duracaoFechado < 150) {
                stats.incompletas++; // Piscou muito rápido/incompleto
            } else if (duracaoFechado < cfgTempoMicrossono) {
                stats.completas++;   // Piscada saudável/normal
            } else {
                stats.microssonos++; // Olho fechado por muito tempo
            }
            eyeWasClosed = false;
        }
      }
    }

    function finishAnalysis() {
        isAnalysing = false;
        scanner.style.display = "none";
        document.title = "100%";

        let totalPiscadas = stats.completas + stats.incompletas;
        let eficiencia = totalPiscadas > 0 ? Math.round((stats.completas / totalPiscadas) * 100) : 100;
        
        // ENVIA para o MIT: RESULT, qtd_piscadas, eficiencia, microssonos, ORDEM_DE_PARADA (FIM)
        let dadosFinais = `RESULT,${stats.completas},${eficiencia},${stats.microssonos},FIM`;
        
        if (window.AppInventor) {
            window.AppInventor.setWebViewString(dadosFinais);
        }
    }

    function calcEAR(lm, top, bottom, left, right) {
        const v = Math.hypot(lm[top].x - lm[bottom].x, lm[top].y - lm[bottom].y);
        const h = Math.hypot(lm[left].x - lm[right].x, lm[left].y - lm[right].y);
        return v / h;
    }
  </script>
</body>
</html>
